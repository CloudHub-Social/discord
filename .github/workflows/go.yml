name: Go

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.26"]
    name: Lint ${{ matrix.go-version == '1.26' && '(latest)' || '(old)' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install libolm
        run: sudo apt-get install libolm-dev libolm3

      - name: Install goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          export PATH="$HOME/go/bin:$PATH"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Lint
        run: pre-commit run -a

      - name: Test
        run: go test -race -count=1 ./...

      - name: Test full pinned Discord dependency
        env:
          DG_OAUTH2_TOKEN: ""
          DGB_TOKEN: ""
          DGU_TOKEN: ""
        run: go test -race -count=1 -timeout 180s github.com/bwmarrin/discordgo/...

      - name: Test quiet health probe and notification deduplication
        run: python3 -m unittest discover -s contrib -p "test_discord_health*.py" -v
